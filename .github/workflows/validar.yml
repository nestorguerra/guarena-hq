# Validadores del backlog técnico (épicas R e I) en cada pull request y cada noche.
# - validate_signs: ninguna marca real ni texto de marcador en la copia publicable (R-07, V-02); las entidades de los
#   rótulos cumplen su esquema y el 100 % de los rótulos tiene entidad o es genérico con motivo (R-02, R-04).
# - La lectura con OCR (R-09, tools/rotulos/legibilidad.py) y el inventario (R-01) necesitan el juego en un navegador
#   y el OCR de macOS: se ejecutan en local y su resultado (data/rotulos/*.json) va en el pull request.
# - validate_interiors: los objetos y los kits cumplen sus esquemas, masas y mínimos (I-02, X-01, X-02); los datos que
#   lee el juego están al día; y cada kit, montado con cinco semillas, pasa el validador de I-04 (obligatorios, nada
#   flotando ni metido en otra cosa, paso libre de 0,9 m, luz, presupuesto V-03, determinismo y variación de I-03), en
#   un Chrome sin ventana y sin sonido. El inventario de puertas (I-01) necesita el juego entero: se toma en local
#   (tools/interiores/inventario.py) y data/interiors_inventory.json va en el pull request.
name: Validar rótulos e interiores

on:
  pull_request:
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate_signs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Adaptación de calidad y límites del navegador
        run: node tools/perf/tests/rendimiento.mjs
      - name: Luz doméstica y restauración de las vistas
        run: node --test tools/interiores/luz_ambiente_pruebas.mjs
      - name: Empaquetar el juego
        run: python3 tools/build.py
      - name: Recursos de suelo e iglesia en Pages, portable y multijugador
        run: python3 tools/perf/tests/carga_assets.py
      - name: Marcas y marcadores en la copia publicable (R-07, V-02)
        run: python3 tools/rotulos/rotulos.py validar dist/test.html
      - name: Entidades y emparejamiento (R-02, R-04)
        run: python3 tools/rotulos/entidades.py
      - name: Informe
        if: always()
        run: |
          python3 - <<'PY'
          import json
          c = json.load(open('data/rotulos/cobertura.json'))
          l = json.load(open('data/rotulos/legibilidad.json'))
          print('rótulos', c['rotulos'], '· con entidad', c['rotulos_con_entidad'], '· genéricos', c['rotulos_genericos'], '· confianza', c['confianza'])
          print('legibilidad (última medida en local): día', l['dia'], '% · noche', l['noche'], '%')
          PY
  validate_interiors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Objetos y kits (I-02, X-01, X-02)
        run: python3 tools/interiores/datos.py
      - name: Los datos del juego, al día con los objetos y los kits
        run: git diff --exit-code src/interiores_datos.js
      - name: Servidor de desarrollo y Chrome sin ventana (siempre sin sonido)
        run: |
          python3 tools/devserver.py 8920 &
          google-chrome --headless=new --mute-audio --remote-debugging-port=9333 --user-data-dir=/tmp/chrome-ci --no-first-run about:blank &
          for i in $(seq 1 40); do curl -sf http://localhost:9333/json/version >/dev/null && curl -sf http://localhost:8920/tools/interiores/validar.html >/dev/null && break; sleep 1; done
      - name: Interiores, cinco semillas por kit (I-03, I-04, V-03)
        run: python3 tools/interiores/validar.py --semillas 1,2,3,4,5
      - name: Contratos funcionales de las viviendas
        run: python3 tools/interiores/casas_pruebas.py --tanda 16
      - name: Recoger objetos próximos y conservar su recompensa al recargar
        run: python3 tools/interiores/botin_pruebas.py --informe /tmp/botin-ci.json
      - name: Cobertura estricta de casas completas (30 en PR, 200 nocturna/manual)
        run: python3 tools/interiores/validar.py --casas ${{ github.event_name == 'pull_request' && '30' || '200' }} --exigir-todas
